<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Fares Store | تشكيلة الشتاء والأحذية</title>
    <style>
        body { font-family: Tahoma, sans-serif; margin: 0; padding: 0; background-color: #f7f8fa; direction: rtl; }
        header { background-color: #2c3e50; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        header nav a { color: white; margin-left: 15px; text-decoration: none; font-weight: bold; }
        .hero-winter { text-align: center; padding: 2rem 1rem; background: linear-gradient(135deg, #2c3e50, #3498db); color: white; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; max-width: 1000px; margin: auto; }
        .product-card { background: white; border-radius: 10px; padding: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .product-card img { max-width: 100%; height: 200px; object-fit: cover; border-radius: 6px; }
        .specs { color: #666; font-size: 0.9rem; margin: 10px 0; }
        .price { color: #e74c3c; font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; }
        .btn-whatsapp { display: block; background-color: #25D366; color: white !important; text-decoration: none; padding: 10px; border-radius: 6px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>Top Fares Store 🧥👢</h1>
        <nav>
            <a href="#">الرئيسية</a>
        </nav>
    </header>

    <section class="hero-winter">
        <h2>دفء وأناقة هذا الشتاء</h2>
        <p>تسوق أحدث صيحات الجواكت والأحذية الشتوية.</p>
    </section>

    <section class="product-grid">
        <div class="product-card">
            <h3>جاكيت شتوي مبطن</h3>
            <p class="specs">المقاسات: M, L, XL, XXL</p>
            <p class="price">850 جنيه</p>
            <a href="https://wa.me/201000000000?text=أريد%20طلب%20الجاكيت%20الشتوي" target="_blank" class="btn-whatsapp">📱 اطلب عبر الواتساب</a>
        </div>
    </section>

</body>
</html>
